name: CI

on:
  push:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go mod tidy
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
        if: github.event_name == 'push'

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go mod tidy
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "ldflags=-s -w -X main.version=${{ github.ref_name }} -X main.commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "ldflags=-s -w -X main.commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build all platforms
        run: |
          mkdir -p dist
          for goos in linux windows darwin; do
            for goarch in amd64 arm64; do
              ext=""
              if [ "$goos" = "windows" ]; then ext=".exe"; fi
              echo "Building $goos/$goarch..."
              CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -v \
                -ldflags="${{ steps.version.outputs.ldflags }}" \
                -o "dist/copilot2api-$goos-$goarch$ext" .
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: copilot2api-binaries
          path: dist/*
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} dist/copilot2api-*

  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: copilot2api-binaries
          path: dist
      - name: Make binaries executable
        run: chmod +x dist/*
      - name: Smoke test image
        run: |
          docker build -f Dockerfile.ci -t copilot2api-smoke .
          docker run --rm copilot2api-smoke --version
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tags
        id: tags
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          DATETIME=$(date -u +%Y%m%d%H%M)
          BRANCH=${GITHUB_REF_NAME}
          SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          TAG="${DATETIME}-${BRANCH}-${SHA}"
          TAGS="${IMAGE_NAME,,}:${TAG}"
          if [ "$BRANCH" = "main" ] || [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${TAGS},${IMAGE_NAME,,}:latest"
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${TAGS},${IMAGE_NAME,,}:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
